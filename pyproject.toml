[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipelie"
version = "0.2.0"
description = "Finds the bugs that leave your data pipeline reporting green while the numbers are wrong."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Saurabh Patel" }]
keywords = ["data-quality", "pandas", "validation", "leakage", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6"]

[project.scripts]
pipelie = "pipelie.cli:main"

[project.urls]
Homepage = "https://github.com/savabs/pipelie"
Writeup = "https://savabs.github.io/2026/08/29/thirteen-ways-a-pipeline-lies.html"

[tool.ruff]
line-length = 100
